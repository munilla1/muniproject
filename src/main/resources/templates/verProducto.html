<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="'Viendo: ' + ${producto.nombre}">Ver Producto</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaeaea;
            margin: 0;
            padding: 20px;
            -webkit-user-select: none;
		    -moz-user-select: none;
		    -ms-user-select: none;
		    user-select: none;
        }

        .viewer-container {
            max-width: 900px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 5px 18px rgba(0,0,0,0.15);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .iframe-box {
            width: 100%;
            height: 80vh;
            border: none;
            border-radius: 12px;
            overflow: hidden;
            margin: 20px 0;
        }

        .btn-back {
            display: inline-block;
            padding: 10px 18px;
            background-color: #3498db;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            transition: 0.3s ease;
        }

        .btn-back:hover {
            background-color: #2980b9;
        }

        /* Anti descarga básica */
        iframe {
            pointer-events: auto;
        }
        body {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
    </style>
</head>

<body>

<div class="viewer-container">

    <h1 th:text="${producto.nombre}">Vista del Producto</h1>

    <!-- Visor del archivo -->
    <iframe th:src="${sasUrl}" class="iframe-box"></iframe>

    <!-- Botón de volver -->
    <a href="/perfil" class="btn-back">⬅ Volver a tus productos</a>

</div>

</body>
</html>
