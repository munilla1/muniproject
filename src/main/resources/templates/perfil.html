<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Destruction App - Perfil</title>

    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/pp.css}">
    <link rel="stylesheet" th:href="@{/css/cssgrid.css}">
    <link rel="stylesheet" th:href="@{/css/perfil.css}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

<header class="contenedor">
    <img th:src="@{/imagenes/mus.png}" alt="Logo" class="logo">

    <nav class="menu" sec:authorize="isAuthenticated()">
        <ul>
            <li><a th:href="@{/pagPrincipalJuego}">Inicio</a></li>
            <li><a th:href="@{/infografias}">Infografías</a></li>
            <li style="color:white;">|</li>
            <li><a th:href="@{/perfil}">Perfil</a></li>

            <li sec:authorize="hasRole('ADMIN')">
                <a th:href="@{/admin/subir-producto}">Subir producto</a>
            </li>
        </ul>
    </nav>

    <div class="contcerrarsesion" sec:authorize="isAuthenticated()">
        <div class="contMensaje">
            <p>
                Usuario:
                <span class="usu"
                      th:text="${#authentication.principal.username}">
                    Nombre de usuario
                </span>
            </p>
        </div>

        <div class="contDdboton">
            <form th:action="@{/logout}" method="post">
                <button type="submit" id="ddboton2" class="btn btn-primary">
                    Cerrar sesión
                </button>
            </form>
        </div>
    </div>
</header>

<div class="contenedor-perfil" sec:authorize="isAuthenticated()">

    <!-- Productos comprados -->
    <div class="productos-comprados">
        <h1>Bienvenido a tu perfil</h1>
        <h2>Productos comprados:</h2>

        <ul id="productosComprados">

		    <li th:if="${productosComprados == null or #lists.isEmpty(productosComprados)}"
		        class="empty-message">
		        No has comprado ningún producto aún.
		    </li>
		
		    <li th:each="producto, iterStat : ${productosComprados}"
		        th:if="${productosComprados != null}">
		        <span th:text="${iterStat.count}"></span>.
		        <span th:text="${producto.nombre}"></span>
		        -
		        <a th:href="@{/ver/{id}(id=${producto.id})}">Ver</a>
		    </li>
		
		</ul>

    </div>

    <div class="formularios-contenedor">

        <!-- Modificar usuario -->
        <div class="formularios">
            <div class="form">
                <h1><b>Modificar Usuario</b></h1>

                <div th:if="${mensaje != null}"
                     class="alert alert-success alert-pequeno">
                    <p th:text="${mensaje}"></p>
                </div>

                <div th:if="${errorModificar != null}"
                     class="alert alert-danger alert-pequeno">
                    <p th:text="${errorModificar}"></p>
                </div>

                <form th:action="@{/modificar}" method="post">

                    <label for="usernameModificar">Nuevo Nombre de Usuario:</label>
                    <input type="text" id="usernameModificar" name="username"
                           class="etivertical" required>

                    <label for="correo">Nuevo Correo:</label>
                    <input type="email" id="correo" name="correo"
                           class="etivertical" required>

                    <label for="passwordActual">Contraseña actual:</label>
                    <input type="password" id="passwordActual"
                           name="passwordActual" class="etipass" required>

                    <label for="passwordNueva">Nueva contraseña:</label>
                    <input type="password" id="passwordNueva"
                           name="passwordNueva" class="etipass" required>

                    <label for="passwordNueva2">Repetir nueva contraseña:</label>
                    <input type="password" id="passwordNueva2"
                           name="passwordNueva2" class="etipass" required>

                    <button class="botonRegistrarse" type="submit">
                        Actualizar
                    </button>
                </form>
            </div>
        </div>

        <!-- Eliminar usuario -->
        <div class="formularios">
            <div class="form">
                <h1><b>Eliminar Usuario</b></h1>

                <div th:if="${errorEliminar != null}">
                    <p style="color:red;" th:text="${errorEliminar}"></p>
                </div>

                <div th:if="${mensajeEliminacion != null}"
                     class="alert alert-success alert-pequeno">
                    <p th:text="${mensajeEliminacion}"></p>
                </div>

                <form th:action="@{/eliminar}" method="post">

                    <label for="usernameEliminar">Nombre de usuario:</label>
                    <input type="text" id="usernameEliminar"
                           name="username" class="etivertical" required>

                    <label for="contrasenaIngresada">Contraseña:</label>
                    <input type="password" id="contrasenaIngresada"
                           name="contrasenaIngresada" class="etipass" required>

                    <button class="botonEliminar" type="submit">
                        Eliminar usuario
                    </button>
                </form>
            </div>
        </div>

    </div>
</div>

<video class="video-container" id="video-bg" muted autoplay loop>
    <source th:src="@{/imagenes/espacio.mp4}" type="video/mp4">
</video>

<div class="pie-pagina">
    <h3 class="pie">Esta es una web creada por A.Munilla. 2023-2024</h3>
</div>

</body>
</html>
