<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Destruction App</title>
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/pp.css}">
    <link rel="stylesheet" th:href="@{/css/cssgrid.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<header class="contenedor">
    <img th:src="@{/imagenes/mus.png}" alt="Logo" class="logo">

    <div class="contcerrarsesion" th:if="${#authorization.expression('isAuthenticated()')}">
        <div class="contMensaje">
            <p>Usuario: <span class="usu" th:text="${#authentication.principal.username}">Nombre de usuario</span></p>
        </div>
        <div class="contDdboton">
            <form th:action="@{/logout}" method="POST">
                <button type="submit" id="ddboton2" class="btn btn-primary">Cerrar sesión</button>
            </form>
        </div>
    </div>
</header>

<video class="video-container" id="video-bg" muted autoplay loop>
    <source th:src="@{/imagenes/espacio.mp4}" type="video/mp4">
</video>

<div class="contenedor-mensaje" th:if="${#authorization.expression('isAuthenticated()')}">
    <div class="cont">
        <img class="telefono" th:src="@{/imagenes/palomita-correcto.png}">
        <h3 class="mensajeconf">
            <b th:text="${#authentication.principal.username}"></b>, acceso confirmado.
        </h3>
    </div>
</div>

<div class="container-botonJugar" th:if="${#authorization.expression('isAuthenticated()')}">
    <a class="botonJugar" th:href="@{/pagPrincipalJuego}">Entrar 🚀</a>
</div>

<div class="pie-pagina">
    <h3 class="pie">Esta es una web creada por A.Munilla. 2023-2024</h3>
</div>

</body>
</html>
