# --- Server ---
server.port=${PORT:8080}
server.servlet.session.timeout=30m

# --- PostgreSQL connection (Railway / local fallback) ---
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:postgres}}}
spring.datasource.username=${PGUSER:${POSTGRES_USER:postgres}}
spring.datasource.password=${PGPASSWORD:${POSTGRES_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Connection pool (HikariCP) ---
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=600000

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# --- Spring Session JDBC ---
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
# En producción con migraciones controladas, cambia a:
# spring.session.jdbc.initialize-schema=never
# spring.session.jdbc.table-name=SPRING_SESSION

# --- Thymeleaf (render HTML) ---
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8

# --- Tomcat / Web ---
spring.main.lazy-initialization=true
server.tomcat.threads.max=50
server.tomcat.accept-count=100
server.tomcat.max-connections=100
server.tomcat.connection-timeout=20000

# --- Logging (solo INFO en prod) ---
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.springframework.security=INFO

# --- Stripe (si usas claves desde Railway variables) ---
# stripe.api.key=${STRIPE_API_KEY}
# stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# --- Seguridad adicional ---
server.error.include-message=never
server.error.include-stacktrace=never


stripe.public.key=${STRIPE_PUBLIC_KEY}
stripe.secret.key=${STRIPE_SECRET_KEY}



