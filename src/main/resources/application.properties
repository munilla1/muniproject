# Puerto de Railway
server.port=${PORT:8080}

# DataSource (con fallback y soportando Railway)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:postgres}}}
spring.datasource.username=${PGUSER:${POSTGRES_USER:postgres}}
spring.datasource.password=${PGPASSWORD:${POSTGRES_PASSWORD:postgres}}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

# Thymeleaf
spring.thymeleaf.cache=true
# (prefix/suffix/mode/encoding son opcionales; puedes omitirlos)

# Sesiones (timeout estándar)
server.servlet.session.timeout=30m

# Logs (niveles razonables para prod)
logging.level.org.springframework=INFO
logging.level.org.springframework.security=INFO


stripe.public.key=${STRIPE_PUBLIC_KEY}
stripe.secret.key=${STRIPE_SECRET_KEY}





